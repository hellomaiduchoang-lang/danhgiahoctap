services:
  - type: web
    name: classtrack
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm --prefix api ci
    startCommand: npm --prefix api run db:migrate && npm --prefix api start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_ORIGIN
        value: https://hellomaiduchoang-lang.github.io
      - key: DATABASE_URL
        fromDatabase:
          name: classtrack-db
          property: connectionString

databases:
  - name: classtrack-db
    databaseName: classtrack
    user: classtrack
    plan: basic-256mb
    region: singapore
