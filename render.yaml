services:
  - type: web
    name: classtrack
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm install
    startCommand: npm run db:migrate && npm run db:seed && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: classtrack-db
          property: connectionString
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: classtrack-db
    databaseName: classtrack
    user: classtrack
    plan: basic-256mb
    region: singapore
